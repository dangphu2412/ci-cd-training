name: Production CD

on:
  push:
    tags:
      - v*

jobs:
  build-prod:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    name: Build RC
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.0.0

      - name: Extract Version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Login docker
        run: docker login -u ${{ vars.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build docker
        run: |
          docker build . \
            -t chuotcona123/training:${{ steps.version.outputs.version }} \
            -t chuotcona123/training:latest

      - name: Docker push
        run: |
          docker push chuotcona123/training:${{ steps.version.outputs.version }} 
          docker push chuotcona123/training:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: rc-${{ steps.version.outputs.version }}
          generate_release_notes: true
