name: CD workflow

on:
  push:
    branches:
      - release/*

jobs:
  build-rc:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    name: Build RC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.0.0

      - name: Read package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate RC Tag
        id: rc
        run: |
          RC_TAG=${{ steps.version.outputs.version }}-rc.${{ github.run_number }}
          echo "tag=${RC_TAG}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v5

      - name: Login docker
        run: docker login -u ${{ vars.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build docker
        run: docker build . -t chuotcona123/training:${{ steps.rc.outputs.tag }}

      - name: Docker push
        run: docker push chuotcona123/training:${{ steps.rc.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: rc-${{ steps.rc.outputs.tag }}
          generate_release_notes: true
