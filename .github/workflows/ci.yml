name: CI workflow

on:
  pull_request:
    branches:
      - main
      - develop
      - release/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.0.0

      - name: Install
        run: npm install
        shell: bash

      - name: Unit Test
        run: npm run test
        shell: bash

      - name: Lint
        run: npm run lint
        shell: bash
